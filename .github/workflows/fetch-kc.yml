name: Fetch Boss KC Snapshots

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-kc:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger KC snapshot on the API
        env:
          API_URL: https://osrsbingobot.onrender.com
        run: |
          # --max-time is generous because Render's free tier spins the API down
          # when idle, so the first request of the day may have to cold-start it.
          response=$(curl -s -w "\n%{http_code}" --max-time 90 -X POST "$API_URL/kc/snapshot" \
            -H "Content-Type: application/json" \
            -d '{"type": "current"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -ge 400 ]; then
            echo "❌ KC snapshot fetch failed with HTTP $http_code"
            exit 1
          fi

          echo "✅ KC snapshot fetch triggered successfully"
