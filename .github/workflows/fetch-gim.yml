name: Fetch GIM Highscores

on:
  schedule:
    # Every 3 days — targeted search near the last known rank (cheap, a handful
    # of requests). Do not bump this to hourly/daily without checking ZenRows
    # quota headroom first.
    - cron: '0 0 */3 * *'
    # Weekly, Sunday midnight — full scan from page 1. This is the only run
    # that recomputes an exact prestige_rank (see fetch_gim_data.py docstring);
    # the cheap runs above just carry the last full-scan's value forward.
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger
    inputs:
      full_scan:
        description: 'Force a full scan (recomputes exact prestige rank, costs ~100 requests)'
        type: boolean
        default: false

jobs:
  fetch-gim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Determine scan mode
        id: scan_mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 0" ] || [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            echo "full_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch GIM data
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          API_URL: https://osrsbingobot.onrender.com
          FULL_SCAN: ${{ steps.scan_mode.outputs.full_scan }}
        run: |
          python fetch_gim_data.py

      - name: Success notification
        if: success()
        run: echo "✅ GIM data fetched successfully"

      - name: Failure notification
        if: failure()
        run: echo "❌ Failed to fetch GIM data"
