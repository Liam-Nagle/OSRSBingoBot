name: Refresh Collection Log Cache

on:
  schedule:
    # Every 6 hours - this is a lifetime total from an external site we don't
    # control the rate limits of, not something that needs to be near-live
    # like KC does.
    - cron: '45 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh-collection-log:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger collection log refresh on the API
        env:
          API_URL: https://osrsbingobot.onrender.com
          DROP_API_KEY: ${{ secrets.DROP_API_KEY }}
        run: |
          # --max-time is generous because Render's free tier spins the API down
          # when idle, so the first request of the day may have to cold-start it.
          response=$(curl -s -w "\n%{http_code}" --max-time 90 -X POST "$API_URL/kc/refresh-collection-log" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $DROP_API_KEY")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -ge 400 ]; then
            echo "❌ Collection log refresh failed with HTTP $http_code"
            exit 1
          fi

          echo "✅ Collection log refresh triggered successfully"
